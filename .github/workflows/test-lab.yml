name: AshenKingdoms Test Lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Godot CLI
        run: bash tools/setup-godot-cli.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install matching Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/.local/share/godot/export_templates/4.6.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_root/"
          test -f "$template_root/web_release.zip"
          test -f "$template_root/android_debug.apk"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Test the test-lab orchestrator
        run: |
          python3 -m unittest discover -s tools -p 'test_test_lab.py' -v
          python3 tools/test_lab.py --list > "$RUNNER_TEMP/test-lab-catalog.json"

      - name: Run automated CI test profile
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: python3 tools/test_lab.py --profile ci --timeout 180 --output-dir "$RUNNER_TEMP/test-lab-results" --report "$RUNNER_TEMP/test-lab-report.json" --markdown "$RUNNER_TEMP/test-lab-report.md"

      - name: Publish test-lab summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/test-lab-report.md"; then
            cat "$RUNNER_TEMP/test-lab-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Test lab did not produce a report. Inspect earlier job steps." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test-lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ashen-test-lab-evidence
          path: |
            ${{ runner.temp }}/test-lab-report.json
            ${{ runner.temp }}/test-lab-report.md
            ${{ runner.temp }}/test-lab-results/
            ${{ runner.temp }}/test-lab-catalog.json
          if-no-files-found: warn
          retention-days: 14
