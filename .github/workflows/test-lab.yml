name: AshenKingdoms Test Lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Godot CLI
        run: bash tools/setup-godot-cli.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test the test-lab orchestrator
        run: |
          python3 -m unittest discover -s tools -p 'test_test_lab.py' -v
          python3 tools/test_lab.py --list > "$RUNNER_TEMP/test-lab-catalog.json"

      - name: Run automated CI test profile
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: python3 tools/test_lab.py --profile ci --timeout 180 --output-dir "$RUNNER_TEMP/test-lab-results" --report "$RUNNER_TEMP/test-lab-report.json" --markdown "$RUNNER_TEMP/test-lab-report.md"

      - name: Publish test-lab summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/test-lab-report.md"; then
            cat "$RUNNER_TEMP/test-lab-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Test lab did not produce a report. Inspect earlier job steps." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test-lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ashen-test-lab-evidence
          path: |
            \${{ runner.temp }}/test-lab-report.json
            \${{ runner.temp }}/test-lab-report.md
            \${{ runner.temp }}/test-lab-results/
            \${{ runner.temp }}/test-lab-catalog.json
          if-no-files-found: warn
          retention-days: 14
