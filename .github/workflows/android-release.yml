name: Android Release AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Android version code (must be higher than the last uploaded value and <= 2100000000)
        type: number
        required: true
      version_name:
        description: Human-readable Android version name
        type: string
        required: true
        default: "0.1.0"

permissions:
  contents: read

# Never run two signing/release jobs concurrently with the same environment.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: android-release
    env:
      GODOT_TEMPLATE_DIR: 4.6.stable
      GODOT_SILENCE_ROOT_WARNING: "1"
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot CLI
        run: bash tools/setup-godot-cli.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install matching export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/.local/share/godot/export_templates/4.6.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_root/"
          test -f "$template_root/android_source.zip"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Export signed Android App Bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64:-}" || { echo "Missing environment secret ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD:-}" || { echo "Missing environment secret ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "${ANDROID_KEYSTORE_ALIAS:-}" || { echo "Missing environment secret ANDROID_KEYSTORE_ALIAS" >&2; exit 1; }
          test -n "${ANDROID_VERSION_CODE:-}" || { echo "Missing version_code input" >&2; exit 1; }
          test -n "${ANDROID_VERSION_NAME:-}" || { echo "Missing version_name input" >&2; exit 1; }
          keystore_path="$RUNNER_TEMP/ashenkingdoms-release.keystore"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          preset_path = Path("export_presets.cfg")
          source = preset_path.read_text(encoding="utf-8")
          marker = "[preset.6.options]"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("Android Play preset options were not found.")
          prefix, options = source[:start], source[start:]

          def quote_godot_string(value: str) -> str:
              if "\n" in value or "\r" in value:
                  raise SystemExit("Android release values must not contain newlines.")
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          version_code = os.environ["ANDROID_VERSION_CODE"].strip()
          if not re.fullmatch(r"[1-9][0-9]*", version_code) or int(version_code) > 2100000000:
              raise SystemExit("version_code must be a positive integer no greater than 2100000000.")
          version_name = os.environ["ANDROID_VERSION_NAME"].strip()
          if not version_name:
              raise SystemExit("version_name must not be empty.")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]{0,49}", version_name):
              raise SystemExit("version_name must be 1-50 characters using letters, digits, dot, underscore, plus, or hyphen.")
          if options.count("version/code=1") != 1:
              raise SystemExit("Expected one default version/code in Android Play preset.")
          options = options.replace("version/code=1", "version/code=" + version_code, 1)
          if options.count('gradle_build/target_sdk="36"') != 1:
              raise SystemExit("Android Play preset must target API 36 for current Google Play submission requirements.")
          if options.count('version/name="0.1.0"') != 1:
              raise SystemExit("Expected one default version/name in Android Play preset.")
          options = options.replace('version/name="0.1.0"', "version/name=" + quote_godot_string(version_name), 1)

          values = {
              'keystore/release=""': "keystore/release=" + quote_godot_string(os.environ["RUNNER_TEMP"] + "/ashenkingdoms-release.keystore"),
              'keystore/release_user=""': "keystore/release_user=" + quote_godot_string(os.environ["ANDROID_KEYSTORE_ALIAS"]),
              'keystore/release_password=""': "keystore/release_password=" + quote_godot_string(os.environ["ANDROID_KEYSTORE_PASSWORD"]),
          }
          for old, new in values.items():
              if options.count(old) != 1:
                  raise SystemExit("Expected one blank signing setting in Android Play preset: " + old)
              options = options.replace(old, new, 1)
          preset_path.write_text(prefix + options, encoding="utf-8")
          PY

          mkdir -p build/android
          godot --headless --path . --install-android-build-template --export-release "Android Play" build/android/AshenKingdoms.aab
          test -s build/android/AshenKingdoms.aab
          jarsigner -verify -verbose -certs build/android/AshenKingdoms.aab > "$RUNNER_TEMP/aab-signature-check.log" 2>&1
          grep -Eiq 'jar verified\.' "$RUNNER_TEMP/aab-signature-check.log" || { cat "$RUNNER_TEMP/aab-signature-check.log"; echo "AAB signature verification did not confirm a signed bundle." >&2; exit 1; }
          unzip -tq build/android/AshenKingdoms.aab
          du -h build/android/AshenKingdoms.aab
          sha256sum build/android/AshenKingdoms.aab

      - name: Upload signed Google Play App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: ashen-kingdoms-android-play-release
          path: build/android/AshenKingdoms.aab
          if-no-files-found: error
          retention-days: 7
