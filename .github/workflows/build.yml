name: Build Game Platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Export Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_TEMPLATE_DIR: 4.6.stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot CLI
        run: bash tools/setup-godot-cli.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install matching export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/.local/share/godot/export_templates/4.6.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_root/"
          test -f "$template_root/web_release.zip"

      - name: Import project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: godot --headless --path . --editor --quit

      - name: Export Web
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html

      - name: Upload Web artifact
        uses: actions/upload-artifact@v7
        with:
          name: ashen-kingdoms-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Export Windows Linux and macOS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_TEMPLATE_DIR: 4.6.stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot CLI
        run: bash tools/setup-godot-cli.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install matching export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/.local/share/godot/export_templates/4.6.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_root/"

      - name: Import project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: godot --headless --path . --editor --quit

      - name: Export Windows
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/AshenKingdoms.exe
          test -s build/windows/AshenKingdoms.exe

      - name: Export Linux
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" build/linux/AshenKingdoms.x86_64
          test -s build/linux/AshenKingdoms.x86_64

      - name: Export macOS
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          mkdir -p build/macos
          godot --headless --path . --export-release "macOS" build/macos/AshenKingdoms.zip
          test -s build/macos/AshenKingdoms.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ashen-kingdoms-windows
          path: build/windows/AshenKingdoms.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ashen-kingdoms-linux
          path: build/linux/AshenKingdoms.x86_64
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ashen-kingdoms-macos
          path: build/macos/AshenKingdoms.zip
          if-no-files-found: error
          retention-days: 7

  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_TEMPLATE_DIR: 4.6.stable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot CLI
        run: bash tools/setup-godot-cli.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install matching export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/.local/share/godot/export_templates/4.6.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_root/"
          test -f "$template_root/android_debug.apk"
          test -f "$template_root/android_source.zip"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Import project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: godot --headless --path . --editor --quit

      - name: Export debug APK
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/AshenKingdoms.apk
          test -s build/android/AshenKingdoms.apk

      - name: Report APK size and checksum
        shell: bash
        run: |
          set -euo pipefail
          stat -c "APK_BYTES=%s" build/android/AshenKingdoms.apk
          du -h build/android/AshenKingdoms.apk
          sha256sum build/android/AshenKingdoms.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ashen-kingdoms-android-debug
          path: build/android/AshenKingdoms.apk
          if-no-files-found: error
          retention-days: 7

      - name: Validate Google Play App Bundle export (ephemeral signing key)
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/ashenkingdoms-ci-validation.keystore"
          trap 'rm -f "$keystore_path" build/android/AshenKingdoms-validation.aab' EXIT
          validation_password="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$keystore_path" \
            -storepass "$validation_password" \
            -keypass "$validation_password" \
            -alias "ashen-ci-validation" \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=AshenKingdoms CI Validation,O=CI Test,C=US" >/dev/null 2>&1
          mkdir -p build/android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$keystore_path" \
          GODOT_ANDROID_KEYSTORE_RELEASE_USER="ashen-ci-validation" \
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$validation_password" \
            godot --headless --path . --install-android-build-template --export-release "Android Play" build/android/AshenKingdoms-validation.aab
          test -s build/android/AshenKingdoms-validation.aab
          jarsigner -verify -verbose -certs build/android/AshenKingdoms-validation.aab > "$RUNNER_TEMP/aab-validation-signature.log" 2>&1
          grep -Eiq 'jar verified\.' "$RUNNER_TEMP/aab-validation-signature.log" || { cat "$RUNNER_TEMP/aab-validation-signature.log"; echo "CI AAB signature validation failed." >&2; exit 1; }
          unzip -tq build/android/AshenKingdoms-validation.aab
          echo "Temporary signed AAB validation succeeded; this test key is not for distribution."

  ios:
    name: Export iOS Xcode project
    if: ${{ vars.IOS_TEAM_ID != '' }}
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Godot CLI for macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip" --output "$RUNNER_TEMP/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          test -x "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS/Godot"
          echo "$RUNNER_TEMP/godot/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"

      - name: Install matching iOS export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/Library/Application Support/Godot/export_templates/4.6.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_root/"
          test -f "$template_root/ios.zip"

      - name: Configure Apple Team ID in export preset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          team_id = os.environ["IOS_TEAM_ID"].strip()
          if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
              raise SystemExit("IOS_TEAM_ID must be the 10-character Apple Developer Team ID.")
          config = Path("export_presets.cfg")
          content = config.read_text(encoding="utf-8")
          marker = 'application/app_store_team_id=""'
          if content.count(marker) != 1:
              raise SystemExit("Expected exactly one empty iOS app_store_team_id setting.")
          config.write_text(content.replace(marker, f'application/app_store_team_id="{team_id}"', 1), encoding="utf-8")
          PY

      - name: Import project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: godot --headless --path . --editor --quit

      - name: Export iOS Xcode project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          mkdir -p build/ios
          godot --headless --path . --export-release "iOS" build/ios/AshenKingdoms.zip
          test -s build/ios/AshenKingdoms.zip

      - name: Upload iOS Xcode project artifact
        uses: actions/upload-artifact@v7
        with:
          name: ashen-kingdoms-ios-xcode-project
          path: build/ios/AshenKingdoms.zip
          if-no-files-found: error
          retention-days: 7
