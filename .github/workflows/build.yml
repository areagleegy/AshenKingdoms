name: Build Android and Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Export Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_TEMPLATE_DIR: 4.6.stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Godot CLI
        run: bash tools/setup-godot-cli.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install matching export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/.local/share/godot/export_templates/4.6.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_root/"
          test -f "$template_root/web_release.zip"

      - name: Import project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: godot --headless --path . --editor --quit

      - name: Export Web
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html

      - name: Upload Web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ashen-kingdoms-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Export Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_TEMPLATE_DIR: 4.6.stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot CLI
        run: bash tools/setup-godot-cli.sh

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install matching export templates
        shell: bash
        run: |
          set -euo pipefail
          template_root="$HOME/.local/share/godot/export_templates/4.6.stable"
          mkdir -p "$template_root" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --silent --show-error "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" --output "$RUNNER_TEMP/templates.tpz"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          test -d "$RUNNER_TEMP/godot-templates/templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_root/"
          test -f "$template_root/android_debug.apk"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          test -d "$JAVA_HOME"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Import project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: godot --headless --path . --editor --quit

      - name: Export debug APK
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/AshenKingdoms.apk
          test -s build/android/AshenKingdoms.apk

      - name: Report APK size and checksum
        shell: bash
        run: |
          set -euo pipefail
          stat -c "APK_BYTES=%s" build/android/AshenKingdoms.apk
          du -h build/android/AshenKingdoms.apk
          sha256sum build/android/AshenKingdoms.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ashen-kingdoms-android-debug
          path: build/android/AshenKingdoms.apk
          if-no-files-found: error
          retention-days: 7

      - name: Stamp source commit and export Android QA APK
        shell: bash
        env:
          QA_BUILD_COMMIT: ${{ github.sha }}
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("scripts/qa/qa_reporter.gd")
          source = path.read_text(encoding="utf-8")
          placeholder = 'const BUILD_COMMIT := "development"'
          if source.count(placeholder) != 1:
              raise SystemExit("Expected exactly one QA build commit placeholder")
          commit = os.environ["QA_BUILD_COMMIT"]
          if not commit or any(char not in "0123456789abcdef" for char in commit.lower()):
              raise SystemExit("Invalid QA build commit identifier")
          path.write_text(source.replace(placeholder, f'const BUILD_COMMIT := "{commit}"'), encoding="utf-8")
          PY
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android QA" build/android/AshenKingdoms-QA.apk
          test -s build/android/AshenKingdoms-QA.apk
          stat -c "QA_APK_BYTES=%s" build/android/AshenKingdoms-QA.apk
          sha256sum build/android/AshenKingdoms-QA.apk

      - name: Upload Android QA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ashen-kingdoms-android-qa
          path: build/android/AshenKingdoms-QA.apk
          if-no-files-found: error
          retention-days: 7
