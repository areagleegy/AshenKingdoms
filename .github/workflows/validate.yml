name: Validate Godot Project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run diagnostics classifier unit tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools -p 'test_ai_test_diagnostics.py' -v 2>&1 | tee "$RUNNER_TEMP/diagnostics-unit-tests.log"

      - name: Benchmark diagnostic corpus
        run: |
          set -o pipefail
          python3 tools/diagnostic_benchmark.py --corpus tools/diagnostic_cases.json --output "$RUNNER_TEMP/diagnostic-benchmark.json" --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee "$RUNNER_TEMP/diagnostic-benchmark.log"

      - name: Install Godot CLI
        run: |
          set -o pipefail
          bash tools/setup-godot-cli.sh 2>&1 | tee "$RUNNER_TEMP/godot-setup.log"

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check required files
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f scenes/boot/Main.tscn
          test -f scripts/core/main.gd
          test -f scripts/core/server.gd
          test -f README.md
          test -f LICENSE
          test -f docs/README.md
          test -f docs/TECHNICAL_ARCHITECTURE.md
          test -f docs/TEST_PLAN.md
          test -f tools/validate_docs.py
          test -f tests/gameplay_smoke_test.gd
          test -f tests/gameplay_regression_test.gd
          test -f tests/content_catalog_smoke_test.gd
          test -f scripts/content/content_catalog.gd
          test -f scripts/content/content_package_installer.gd
          test -f scripts/content/content_manager.gd
          test -f scripts/content/content_asset_loader.gd
          test -f scripts/ui/content_library.gd
          test -f scenes/ui/ContentLibrary.tscn
          test -f tools/package_content.py
          test -f tools/test_package_content.py
          test -f tools/sign_content_catalog.py
          test -f tools/test_sign_content_catalog.py
          test -f tools/validate_free_assets.py
          test -f assets/ashenkingdoms_icon.svg
          test -f scenes/ui/MainMenu.tscn
          test -f scenes/network/MultiplayerArena.tscn
          test -f scenes/network/NetworkAvatar.tscn
          test -f scenes/network/NetworkEnemy.tscn
          test -f scenes/ui/VirtualJoystick.tscn
          test -f scenes/ui/TouchControls.tscn
          test -f scripts/core/network_manager.gd
          test -f scripts/networking/multiplayer_arena.gd
          test -f scripts/networking/network_avatar.gd
          test -f scripts/networking/network_enemy.gd
          test -f scripts/ui/main_menu.gd
          test -f scripts/ui/virtual_joystick.gd
          test -f docs/NETWORKING.md
          test -f tests/script_load_smoke_test.gd
          test -f tests/network_client_smoke_test.gd
          test -f tests/network_combat_smoke_test.gd
          test -f tests/network_combat_smoke_test.tscn
          test -f tools/test-network-loopback.sh
          test -f tools/generate_player_glb.py
          test -f tests/player_character_smoke_test.gd
          test -f docs/PLUGIN_INTEGRATION_AR.md
          test -f docs/FREE_ASSET_PIPELINE_AR.md
          test -f docs/AI_PLAYER_CHARACTER_PIPELINE_AR.md
          test -f assets/video/cinematics/.gitkeep
          test -f assets/ui/.gitkeep
          test -f assets/materials/.gitkeep
          test -f assets/environments/.gitkeep
          test -f assets/characters/player/README.md
          test -f assets/audio/voice/ar/.gitkeep
          test -f assets/audio/sfx/.gitkeep
          test -f assets/audio/music/.gitkeep
          test -f assets/asset_manifest.json
          test -f addons/ashen_free_asset_pipeline/plugin.gd
          test -f addons/ashen_free_asset_pipeline/plugin.cfg
          test -f addons/ashen_asset_bridge/plugin.gd
          test -f addons/ashen_asset_bridge/plugin.cfg
          test -f tools/test_ai_test_diagnostics.py
          test -f tools/diagnostic_cases.json
          test -f tools/diagnostic_benchmark.py
          test -f tools/ai_test_diagnostics.py
          test -f content/world/world_catalog.json
          test -f docs/WORLD_BIBLE_AR.md
          test -f scripts/world/world_catalog_loader.gd
          test -f tests/world_catalog_loader_test.gd
          test -f tools/validate_world_catalog.py
          test -f tools/test_world_catalog.py

      - name: Validate local Markdown links
        run: python3 tools/validate_docs.py

      - name: Import and parse project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Validate local asset tools and license manifest
        run: |
          python3 -m py_compile tools/generate_player_glb.py tools/validate_free_assets.py
          python3 tools/generate_player_glb.py --help > /dev/null
          python3 tools/validate_free_assets.py

      - name: Load every GDScript and scene
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/script_load_smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/resource-smoke.log"

      - name: Run gameplay smoke tests
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/gameplay_smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/gameplay-tests.log"

      - name: Run gameplay regression tests
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/gameplay_regression_test.gd 2>&1 | tee "$RUNNER_TEMP/gameplay-regression.log"

      - name: Run player character smoke tests
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/player_character_smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/player-character-tests.log"

      - name: Run network combat smoke tests
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          timeout 45s godot --headless --path . res://tests/network_combat_smoke_test.tscn 2>&1 | tee "$RUNNER_TEMP/network-combat.log"

      - name: Run local ENet host/client integration test
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          bash tools/test-network-loopback.sh 2>&1 | tee "$RUNNER_TEMP/network-loopback.log"

      - name: Run content catalog and installer smoke tests
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/content_catalog_smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/content-tests.log"

      - name: Run content package builder tests
        run: |
          set -o pipefail
          python -m unittest tools.test_package_content tools.test_sign_content_catalog -v 2>&1 | tee "$RUNNER_TEMP/python-tests.log"

      - name: Validate world catalog data
        run: |
          python3 -m py_compile tools/validate_world_catalog.py tools/test_world_catalog.py
          python3 tools/validate_world_catalog.py
          python3 -m unittest tools.test_world_catalog -v

      - name: Run runtime world catalog loader tests
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/world_catalog_loader_test.gd 2>&1 | tee "$RUNNER_TEMP/world-catalog-loader.log"

      - name: Diagnose test logs
        if: always()
        env:
          ASHEN_AI_DIAGNOSE: ${{ vars.ASHEN_AI_DIAGNOSE }}
          ASHEN_AI_ENDPOINT: ${{ secrets.ASHEN_AI_ENDPOINT }}
          ASHEN_AI_API_KEY: ${{ secrets.ASHEN_AI_API_KEY }}
          ASHEN_AI_MODEL: ${{ vars.ASHEN_AI_MODEL }}
        run: python3 tools/ai_test_diagnostics.py --log "$RUNNER_TEMP/diagnostics-unit-tests.log" --log "$RUNNER_TEMP/diagnostic-benchmark.log" --log "$RUNNER_TEMP/godot-setup.log" --log "$RUNNER_TEMP/godot-import.log" --log "$RUNNER_TEMP/gameplay-tests.log" --log "$RUNNER_TEMP/gameplay-regression.log" --log "$RUNNER_TEMP/content-tests.log" --log "$RUNNER_TEMP/python-tests.log" --log "$RUNNER_TEMP/player-character-tests.log" --log "$RUNNER_TEMP/resource-smoke.log" --log "$RUNNER_TEMP/network-combat.log" --log "$RUNNER_TEMP/network-loopback.log" --output "$RUNNER_TEMP/ashen-test-diagnostics.json"

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashen-test-diagnostics
          path: |
            ${{ runner.temp }}/ashen-test-diagnostics.json
            ${{ runner.temp }}/diagnostic-benchmark.json
          if-no-files-found: warn
          retention-days: 7
