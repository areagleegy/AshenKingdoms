name: Validate Godot Project

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run diagnostics classifier unit tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools -p 'test_ai_test_diagnostics.py' -v 2>&1 | tee "$RUNNER_TEMP/diagnostics-unit-tests.log"

      - name: Install Godot CLI
        run: |
          set -o pipefail
          bash tools/setup-godot-cli.sh 2>&1 | tee "$RUNNER_TEMP/godot-setup.log"

      - name: Add Godot to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check required files
        run: |
          set -o pipefail
          {
            set -euo pipefail
            required_files=(
              project.godot
              export_presets.cfg
              scenes/boot/Main.tscn
              scripts/core/main.gd
              scripts/core/server.gd
              README.md
              LICENSE
              docs/TECHNICAL_ARCHITECTURE.md
              docs/TEST_PLAN.md
              tests/gameplay_smoke_test.gd
              tools/ai_test_diagnostics.py
              tools/test_ai_test_diagnostics.py
              tools/diagnostic_cases.json
            )
            missing=0
            for path in "${required_files[@]}"; do
              if [[ -f "$path" ]]; then
                echo "[OK] Required file: $path"
              else
                echo "::error file=$path::Missing required file: $path"
                echo "MISSING REQUIRED FILE: $path"
                missing=1
              fi
            done
            exit "$missing"
          } 2>&1 | tee "$RUNNER_TEMP/required-files.log"

      - name: Import and parse project
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Run gameplay smoke tests
        env:
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/gameplay_smoke_test.gd 2>&1 | tee "$RUNNER_TEMP/gameplay-tests.log"

      - name: Diagnose test logs
        if: always()
        env:
          ASHEN_AI_DIAGNOSE: ${{ vars.ASHEN_AI_DIAGNOSE }}
          ASHEN_AI_ENDPOINT: ${{ secrets.ASHEN_AI_ENDPOINT }}
          ASHEN_AI_API_KEY: ${{ secrets.ASHEN_AI_API_KEY }}
          ASHEN_AI_MODEL: ${{ vars.ASHEN_AI_MODEL }}
        run: |
          python3 tools/ai_test_diagnostics.py --log "$RUNNER_TEMP/diagnostics-unit-tests.log" --log "$RUNNER_TEMP/godot-setup.log" --log "$RUNNER_TEMP/required-files.log" --log "$RUNNER_TEMP/godot-import.log" --log "$RUNNER_TEMP/gameplay-tests.log" --output "$RUNNER_TEMP/ashen-test-diagnostics.json"
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashen-test-diagnostics
          path: ${{ runner.temp }}/ashen-test-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
